<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài Xỉu</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="game">
    <h1>🎲</h1>
    <p>Xỉu: 2–6 | Tài: 7–12</p>

    <button class="choose" id="taiBtn" onclick="chon('tai')">
      TÀI (7–12)
    </button>

    <button class="choose" id="xiuBtn" onclick="chon('xiu')">
      XỈU (2–6)
    </button>

    <div class="dice-area">
      <div class="dice" id="dice1">?</div>
      <div class="dice" id="dice2">?</div>
    </div>

    <button id="rollBtn" onclick="lacXucXac()">LẮC XÚC XẮC</button>

    <div id="result">Hãy chọn Tài hoặc Xỉu.</div>
  </div>

  <script>
    let luaChon = "";

    function chon(loai) {
      luaChon = loai;

      document.getElementById("taiBtn").classList.remove("active");
      document.getElementById("xiuBtn").classList.remove("active");

      if (loai === "tai") {
        document.getElementById("taiBtn").classList.add("active");
      } else {
        document.getElementById("xiuBtn").classList.add("active");
      }

      document.getElementById("result").innerText =
        "Bạn đã chọn: " + (loai === "tai" ? "TÀI" : "XỈU");
    }

    function lacXucXac() {
      if (luaChon === "") {
        document.getElementById("result").innerText =
          "⚠️ Hãy chọn Tài hoặc Xỉu trước!";
        return;
      }

      let xucXac1 = Math.floor(Math.random() * 6) + 1;
      let xucXac2 = Math.floor(Math.random() * 6) + 1;

      let tong = xucXac1 + xucXac2;
      let ketQua = tong >= 7 ? "tai" : "xiu";

      document.getElementById("dice1").innerText = xucXac1;
      document.getElementById("dice2").innerText = xucXac2;

      let thongBao = `Bạn ra ${xucXac1} và ${xucXac2}. Tổng là ${tong} → ${ketQua.toUpperCase()}.`;

      if (luaChon === ketQua) {
        document.getElementById("result").innerText =
          "🎉 " + thongBao + " Bạn thắng!";
      } else {
        document.getElementById("result").innerText =
          "😢 " + thongBao + " Bạn thua!";
      }
    }
  </script>
</body>
</html>
